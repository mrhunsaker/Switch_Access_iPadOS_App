name: Swift formatting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Swift source
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      SWIFT_FORMAT_VERSION: "604.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned swift-format
        run: brew install swift-format

      - name: Verify formatter version
        run: |
          swift-format --version
          swift-format --version | grep -F "$SWIFT_FORMAT_VERSION"

      - name: Lint using repository configuration
        run: swift-format lint --strict --recursive SwitchPlay
